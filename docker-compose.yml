services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectra}
      POSTGRES_DB: ${POSTGRES_DB:-projectra}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the DB host is the "db" service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectra}:${POSTGRES_PASSWORD:-projectra}@db:5432/${POSTGRES_DB:-projectra}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com}
      GROQ_PROXY_URL: ${GROQ_PROXY_URL:-}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-60000}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-2048}
      GROQ_MAX_TOOL_ROUNDS: ${GROQ_MAX_TOOL_ROUNDS:-6}
      PROJECTRA_AI_DEBUG: ${PROJECTRA_AI_DEBUG:-0}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # Persist user uploads (attachments/avatars) across restarts.
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
