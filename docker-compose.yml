services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectra}
      POSTGRES_DB: ${POSTGRES_DB:-projectra}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the DB host is the "db" service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectra}:${POSTGRES_PASSWORD:-projectra}@db:5432/${POSTGRES_DB:-projectra}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-ProjectRA}
      OPENROUTER_PROXY_URL: ${OPENROUTER_PROXY_URL:-}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-60000}
      PROJECTRA_AI_PROXY_URL: ${PROJECTRA_AI_PROXY_URL:-}
      PROJECTRA_AI_HISTORY_MESSAGES: ${PROJECTRA_AI_HISTORY_MESSAGES:-12}
      PROJECTRA_AI_MAX_COMPLETION_TOKENS: ${PROJECTRA_AI_MAX_COMPLETION_TOKENS:-2048}
      PROJECTRA_AI_MAX_TOOL_ROUNDS: ${PROJECTRA_AI_MAX_TOOL_ROUNDS:-8}
      PROJECTRA_AI_DEBUG: ${PROJECTRA_AI_DEBUG:-0}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # Persist user uploads (attachments/avatars) across restarts.
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
